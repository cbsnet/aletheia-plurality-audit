[project]
name = "aletheia-plurality-audit"
version = "0.1.0"
description = "Epistemic review aids for mitigating apparent plurality in synthetic governance threads."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Tony Sale", url = "https://www.tonysale.com" }]
keywords = ["ai-safety", "epistemology", "governance", "llm", "deliberation"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.38",
    "umap-learn>=0.5.6",
]
embeddings = [
    "sentence-transformers>=3.0",
]
api = [
    "google-genai>=1.0.0",
    "openai>=1.50",
    "python-dotenv>=1.0",
]
viz = [
    "plotly>=5.24",
    "kaleido>=0.2.1",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "networkx>=3.3",
    "pyvis>=0.3.2",
]
report = [
    "pytest-html>=4.1",
    "coverage[toml]>=7.6",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-html>=4.1",
    "ruff>=0.6.9",
    "pre-commit>=3.8",
]

[project.urls]
Homepage = "https://www.tonysale.com"
Repository = "https://github.com/cbsnet/aletheia-plurality-audit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aletheia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=aletheia --cov-report=term-missing --cov-report=html"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "requires_api: tests that require external API keys",
]

[tool.coverage.run]
branch = true
source = ["src/aletheia"]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]